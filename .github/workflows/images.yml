# Build and push the fuse-client image (client, coordinator, csi-driver,
# node-init, globalcp) on each main commit, and publish its digest in the
# artifacts.json format that sky-control's deploy/skyfleet deploys from.
# Building is automatic; rolling out is `skyfleet deploy` (manual).
#
# Registry login: repository variable ACR_NAME and either OIDC
# (AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID with AcrPush) or
# ACR_USERNAME variable + ACR_PASSWORD secret. Without either it still builds
# (a broken image fails main) and skips the push.
name: images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  REPO: skyctl-mb/fuse-client
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: login
        run: |
          if [ -z "$ACR_NAME" ]; then echo mode=none >> "$GITHUB_OUTPUT";
          elif [ -n "${{ vars.AZURE_CLIENT_ID }}" ]; then echo mode=oidc >> "$GITHUB_OUTPUT";
          elif [ -n "${{ vars.ACR_USERNAME }}" ]; then echo mode=token >> "$GITHUB_OUTPUT";
          else echo mode=none >> "$GITHUB_OUTPUT"; fi
      - if: steps.login.outputs.mode == 'oidc'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - if: steps.login.outputs.mode == 'oidc'
        run: az acr login -n "$ACR_NAME"
      - if: steps.login.outputs.mode == 'token'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.login.outputs.mode != 'none' }}
          tags: |
            ${{ env.ACR_NAME || 'local' }}.azurecr.io/${{ env.REPO }}:main-${{ github.sha }}
            ${{ env.ACR_NAME || 'local' }}.azurecr.io/${{ env.REPO }}:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=fuse-client
          cache-to: type=gha,mode=max,scope=fuse-client
      - if: steps.login.outputs.mode != 'none'
        run: |
          printf '{"commit":"%s","repo":"%s","images":{"fuse-client":"%s.azurecr.io/%s@%s"}}\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$ACR_NAME" "$REPO" "${{ steps.build.outputs.digest }}" | tee artifacts.json
      - if: steps.login.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ github.sha }}
          path: artifacts.json
          retention-days: 90
