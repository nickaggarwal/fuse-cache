{{- if .Values.coordinator.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coordinator-state
  namespace: {{ include "fuse-cache.namespace" . }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.coordinator.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.coordinator.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: {{ include "fuse-cache.namespace" . }}
  labels:
    app: coordinator
spec:
  replicas: {{ .Values.coordinator.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
    spec:
      containers:
        - name: coordinator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["coordinator"]
          args:
            - "-port"
            - "{{ .Values.coordinator.httpPort }}"
            {{- if and .Values.globalCP.enabled .Values.globalCP.embedded }}
            # DEV ONLY: the control plane runs in-process on loopback with
            # no TLS. Every -global-* setting arrives through the ConfigMap;
            # only the loopback port is a literal, because nothing outside
            # this pod can reach it and so nothing else needs to know it.
            - "-global-embedded-port"
            - "{{ .Values.globalCP.embeddedPort }}"
            {{- end }}
          envFrom:
            - configMapRef:
                name: fuse-config
            {{- if .Values.secrets.azure.create }}
            - secretRef:
                name: {{ .Values.secrets.azure.name }}
            {{- end }}
            {{- if .Values.secrets.aws.create }}
            - secretRef:
                name: {{ .Values.secrets.aws.name }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.coordinator.httpPort }}
              name: http
            - containerPort: {{ .Values.coordinator.grpcPort }}
              name: grpc
          {{- if or .Values.coordinator.persistence.enabled (and .Values.globalCP.enabled .Values.globalCP.tls.secretName) }}
          volumeMounts:
            {{- if .Values.coordinator.persistence.enabled }}
            - name: state
              mountPath: /data
            {{- end }}
            {{- if and .Values.globalCP.enabled .Values.globalCP.tls.secretName }}
            # This cluster's identity to the federation. The control plane
            # reads the certificate's first DNS SAN as the cluster ID, so
            # the file mounted here decides what this cluster IS globally,
            # not merely how it encrypts.
            - name: global-tls
              mountPath: /etc/fuse-global/tls
              readOnly: true
            {{- end }}
          {{- end }}
          {{- if .Values.coordinator.persistence.enabled }}
          workingDir: /data
          {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.coordinator.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.coordinator.httpPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.coordinator.resources | nindent 12 }}
      {{- if or .Values.coordinator.persistence.enabled (and .Values.globalCP.enabled .Values.globalCP.tls.secretName) }}
      volumes:
        {{- if .Values.coordinator.persistence.enabled }}
        - name: state
          persistentVolumeClaim:
            claimName: coordinator-state
        {{- end }}
        {{- if and .Values.globalCP.enabled .Values.globalCP.tls.secretName }}
        - name: global-tls
          secret:
            secretName: {{ .Values.globalCP.tls.secretName }}
            defaultMode: 0400
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: {{ include "fuse-cache.namespace" . }}
  labels:
    app: coordinator
spec:
  type: ClusterIP
  selector:
    app: coordinator
  ports:
    - port: {{ .Values.coordinator.httpPort }}
      targetPort: {{ .Values.coordinator.httpPort }}
      protocol: TCP
      name: http
    - port: {{ .Values.coordinator.grpcPort }}
      targetPort: {{ .Values.coordinator.grpcPort }}
      protocol: TCP
      name: grpc
