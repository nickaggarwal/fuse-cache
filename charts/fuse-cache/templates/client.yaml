apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: client
  namespace: {{ include "fuse-cache.namespace" . }}
  labels:
    app: client
spec:
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      hostPID: true
      nodeSelector:
        {{- toYaml .Values.client.nodeSelector | nindent 8 }}
      initContainers:
        {{- if .Values.nodeInit.enabled }}
        # Discovers the best local disk, prepares the cache dir on it, and
        # writes the config the client adopts (cloud-agnostic deployment).
        - name: node-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node-init"]
          args:
            - "-mode"
            - "init"
            - "-host-root"
            - "{{ .Values.nodeInit.hostRootContainerPath }}"
            - "-config"
            - "{{ .Values.nodeInit.configPath }}"
            - "-cache-subdir"
            - "{{ .Values.nodeInit.cacheSubdir }}"
            - "-min-free-gb"
            - "{{ .Values.nodeInit.minFreeGB }}"
            - "-cache-fraction"
            - "{{ .Values.nodeInit.cacheFraction }}"
            - "-max-cache-gb"
            - "{{ .Values.nodeInit.maxCacheGB }}"
            - "-benchmark={{ .Values.nodeInit.benchmark }}"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-root
              mountPath: {{ .Values.nodeInit.hostRootContainerPath }}
              # See raw-disk mounts node-init makes in the host mount namespace.
              mountPropagation: HostToContainer
            - name: agent-socket
              mountPath: /var/run/fuse-client
        {{- end }}
        - name: prepare-fuse-mount
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ROOT="{{ .Values.client.fuseRootContainerPath }}"
              TARGET="{{ .Values.client.fuseMountContainerPath }}"
              MAX_RETRIES={{ .Values.client.mountPrepareRetries }}
              DELAY={{ .Values.client.mountPrepareRetryDelaySeconds }}
              mkdir -p "${ROOT}"
              i=1
              while [ "$i" -le "$MAX_RETRIES" ]; do
                echo "prepare-fuse-mount: attempt ${i}/${MAX_RETRIES} for ${TARGET}"
                fusermount3 -u -z "${TARGET}" >/dev/null 2>&1 || true
                fusermount -u -z "${TARGET}" >/dev/null 2>&1 || true
                umount -l "${TARGET}" >/dev/null 2>&1 || true
                rm -rf "${TARGET}" >/dev/null 2>&1 || true
                mkdir -p "${TARGET}" || true
                if stat "${TARGET}" >/dev/null 2>&1; then
                  chmod 0777 "${TARGET}" >/dev/null 2>&1 || true
                  exit 0
                fi
                sleep "${DELAY}"
                i=$((i+1))
              done
              echo "prepare-fuse-mount: unable to recover ${TARGET} after ${MAX_RETRIES} attempts"
              exit 1
          securityContext:
            privileged: true
          volumeMounts:
            - name: fuse-mount
              mountPath: {{ .Values.client.fuseRootContainerPath }}
              mountPropagation: Bidirectional
      containers:
        {{- if and .Values.nodeInit.enabled .Values.nodeInit.daemonSidecar }}
        # Sidecar: refreshes measured free space / cache budget in the
        # node-init config; re-runs discovery if the cache dir vanishes.
        - name: node-init-daemon
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node-init"]
          args:
            - "-mode"
            - "daemon"
            - "-host-root"
            - "{{ .Values.nodeInit.hostRootContainerPath }}"
            - "-config"
            - "{{ .Values.nodeInit.configPath }}"
            - "-cache-subdir"
            - "{{ .Values.nodeInit.cacheSubdir }}"
            - "-min-free-gb"
            - "{{ .Values.nodeInit.minFreeGB }}"
            - "-cache-fraction"
            - "{{ .Values.nodeInit.cacheFraction }}"
            - "-max-cache-gb"
            - "{{ .Values.nodeInit.maxCacheGB }}"
            - "-refresh-interval-sec"
            - "{{ .Values.nodeInit.refreshIntervalSeconds }}"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-root
              mountPath: {{ .Values.nodeInit.hostRootContainerPath }}
              # See raw-disk mounts node-init makes in the host mount namespace.
              mountPropagation: HostToContainer
            - name: agent-socket
              mountPath: /var/run/fuse-client
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        {{- end }}
        - name: client
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["client"]
          args:
            - "-mount"
            - "$(FUSE_MOUNT_PATH)"
            - "-nvme"
            - "$(NVME_CACHE_PATH)"
            - "-nvme-max-gb"
            - "$(FUSE_NVME_MAX_GB)"
            {{- if .Values.nodeInit.enabled }}
            - "-node-init-config"
            - "{{ .Values.nodeInit.configPath }}"
            - "-node-init-host-root"
            - "{{ .Values.nodeInit.hostRootContainerPath }}"
            {{- end }}
            - "-coordinator"
            - "$(COORDINATOR_ADDR)"
            - "-port"
            - "{{ .Values.client.httpPort }}"
            - "-chunk-size"
            - "$(CHUNK_SIZE_MB)"
            - "-cloud-provider"
            - "{{ .Values.client.cloudProvider }}"
            - "-s3-bucket"
            - "$(S3_BUCKET)"
            - "-s3-region"
            - "$(S3_REGION)"
            {{- if eq (.Values.config.s3AdvancedArgsEnabled | toString) "true" }}
            - "-s3-download-concurrency"
            - "$(FUSE_S3_DOWNLOAD_CONCURRENCY)"
            - "-s3-download-part-size-mb"
            - "$(FUSE_S3_DOWNLOAD_PART_SIZE_MB)"
            - "-s3-upload-concurrency"
            - "$(FUSE_S3_UPLOAD_CONCURRENCY)"
            - "-s3-upload-part-size-mb"
            - "$(FUSE_S3_UPLOAD_PART_SIZE_MB)"
            - "-s3-endpoint"
            - "$(S3_ENDPOINT)"
            {{- end }}
          envFrom:
            - configMapRef:
                name: fuse-config
            - secretRef:
                name: {{ .Values.secrets.azure.name }}
            {{- if .Values.secrets.aws.create }}
            - secretRef:
                name: {{ .Values.secrets.aws.name }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FUSE_PEER_READ_MBPS
              value: {{ .Values.config.peerReadMBps | quote }}
          ports:
            - containerPort: {{ .Values.client.httpPort }}
              name: http
            - containerPort: {{ .Values.client.grpcPort }}
              name: grpc
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_ADMIN
                - MKNOD
          volumeMounts:
            - name: fuse-device
              mountPath: /dev/fuse
            - name: nvme-storage
              mountPath: /mnt/nvme
            {{- if .Values.nodeInit.enabled }}
            - name: host-root
              mountPath: {{ .Values.nodeInit.hostRootContainerPath }}
            {{- end }}
            - name: fuse-mount
              mountPath: {{ .Values.client.fuseRootContainerPath }}
              mountPropagation: Bidirectional
            - name: agent-socket
              mountPath: /var/run/fuse-client
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - >
                    fusermount3 -u -z {{ .Values.client.fuseMountContainerPath }} ||
                    umount -l {{ .Values.client.fuseMountContainerPath }} ||
                    true
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.client.httpPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.client.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.client.resources | nindent 12 }}
      volumes:
        - name: fuse-device
          hostPath:
            path: {{ .Values.client.fuseDevicePath }}
        {{- if .Values.nodeInit.enabled }}
        - name: host-root
          hostPath:
            path: /
            type: Directory
        {{- end }}
        - name: nvme-storage
          hostPath:
            path: {{ .Values.client.nvmeHostPath }}
            type: Directory
        - name: fuse-mount
          hostPath:
            path: {{ .Values.client.fuseHostPath }}
            type: Directory
        - name: agent-socket
          hostPath:
            path: /var/run/fuse-client
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: client-headless
  namespace: {{ include "fuse-cache.namespace" . }}
  labels:
    app: client
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: client
  ports:
    - port: {{ .Values.client.httpPort }}
      targetPort: {{ .Values.client.httpPort }}
      protocol: TCP
      name: http
    - port: {{ .Values.client.grpcPort }}
      targetPort: {{ .Values.client.grpcPort }}
      protocol: TCP
      name: grpc
---
# Stable ClusterIP service for external consumers (pod-snapshotter's manager
# defaults its fuseAPIEndpoint to fuse-client.<ns>.svc:8081). GOTCHA
# (2026-08-01, EKS): only client-headless existed, so every artifact
# existence check failed DNS and restores timed out in Pending.
apiVersion: v1
kind: Service
metadata:
  name: fuse-client
  namespace: {{ include "fuse-cache.namespace" . }}
  labels:
    app: client
spec:
  type: ClusterIP
  selector:
    app: client
  ports:
    - port: {{ .Values.client.httpPort }}
      targetPort: {{ .Values.client.httpPort }}
      protocol: TCP
      name: http
