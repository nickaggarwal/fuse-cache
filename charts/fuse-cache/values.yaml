namespace:
  create: true
  name: fuse-system

image:
  repository: stargzrepo.azurecr.io/fuse-client
  tag: latest
  pullPolicy: IfNotPresent

coordinator:
  replicaCount: 1
  httpPort: 8080
  grpcPort: 9080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  persistence:
    enabled: true
    storageClassName: managed-csi
    size: 1Gi

client:
  nodeSelector: {}
  httpPort: 8081
  grpcPort: 9081
  cloudProvider: azure
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi
  fuseDevicePath: /dev/fuse
  nvmeHostPath: /mnt
  fuseHostPath: /mnt
  fuseMountHostPath: /mnt/fuse
  fuseRootContainerPath: /host/mnt
  fuseMountContainerPath: /host/mnt/fuse
  mountPrepareRetries: 10
  mountPrepareRetryDelaySeconds: 2
  # Peer labels for warm targeting (coordinator POST /api/warm labels=...).
  #
  # peerLabelsFromNode imports keys off each node's own Node object, so one
  # DaemonSet labels every nodepool correctly. Format: comma-separated node
  # label keys, each optionally renamed "peerKey=nodeKey". Setting it also
  # creates a ServiceAccount + ClusterRole granting get on nodes.
  #   AKS: pool=agentpool     EKS: pool=eks.amazonaws.com/nodegroup
  #   GKE: pool=cloud.google.com/gke-nodepool
  # Empty disables the lookup and the RBAC.
  peerLabelsFromNode: "pool=agentpool,zone=topology.kubernetes.io/zone"
  # Static fallback labels, same "k=v,k=v" form. Node-derived keys win.
  peerLabels: ""

# node-init discovers the best local disk on every node (NVMe > SSD >
# ephemeral > HDD by media class, free space, and a micro-benchmark),
# prepares <mount>/<cacheSubdir> on it, and hands the path + byte budget to
# the client — so this chart deploys unchanged on AKS, EKS, GKE, or bare
# metal. When disabled, the static config.nvmeCachePath/nvmeMaxGB are used.
nodeInit:
  # Automatic best-local-disk discovery. Validated on AKS A100 + L-series:
  # reads the host mount table and, for a large raw/unformatted local NVMe,
  # formats it ext4 and mounts it, so the client uses the full NVMe (e.g.
  # ~700 GiB) instead of the small temp disk; falls open to the static -nvme
  # path if discovery fails. Left OFF by default because it FORMATS a raw disk
  # (safe only on empty, non-OS, unmounted disks — guarded, but destructive):
  # enable per node pool once you've confirmed the target disk layout.
  enabled: false
  hostRootContainerPath: /host
  configPath: /var/run/fuse-client/node-init.json
  cacheSubdir: fuse-cache
  minFreeGB: 2
  cacheFraction: "0.8"
  maxCacheGB: 0        # 0 = uncapped
  benchmark: true
  refreshIntervalSeconds: 60
  daemonSidecar: true  # keep refreshing capacity after init

config:
  coordinatorAddr: ""
  coordinatorGrpcAddr: ""
  nvmeCachePath: /mnt/nvme/cache
  nvmeMaxGB: "10"
  fuseMountPath: /host/mnt/fuse
  chunkSizeMB: "16"
  parallelRangeReads: "32"
  rangePrefetchChunks: "8"
  rangePrefetchMaxChunks: "32"
  rangeChunkCacheSize: "128"
  rangeChunkCacheMaxBytesMB: "512"
  rangePrefetchMaxBytesMB: "128"
  peerReadSortByNetwork: "true"
  peerReadParallelFanout: "true"
  peerReadMBps: "10000"
  s3Bucket: "fuse-client-cache"
  s3Region: "us-east-1"
  s3DownloadConcurrency: "32"
  s3DownloadPartSizeMB: "8"
  s3UploadConcurrency: "16"
  s3UploadPartSizeMB: "8"
  s3Endpoint: ""
  s3ForcePathStyle: "false"
  s3AdvancedArgsEnabled: "false"
  azureDownloadConcurrency: "8"
  azureDownloadBlockSizeMB: "4"
  azureParallelDownloadMinSizeMB: "8"
  hybridAlwaysMinSizeMB: "512"
  hybridStripeMinSizeMB: "1024"
  hybridHedgeDelayMs: "20"
  hybridMaxSecondaryInflight: "16"
  adaptiveRemoteRead: "true"
  peerRawTransport: "true"
  fuseIOProgressMB: "512"
  netProbeEnabled: "true"
  netProbeBytes: "1048576"
  netProbeTimeoutMs: "2000"
  netProbeEveryHeartbeats: "2"
  fuseBackend: "gofuse"
  goFuseEnablePassthrough: "true"
  goFuseWriteAppendBufferMB: "8"
  # Writeback cache measured on EKS i7ie (2026-08-01): +4-6% on >=64MB
  # sequential writes but -14% on small files (flush amplification), and the
  # append buffer already coalesces small writes. Default OFF; flip per
  # deployment only for workloads that are exclusively large sequential
  # writes (e.g. checkpoint-save-heavy nodes).
  goFuseWritebackCache: "false"
  # 4MB kernel write size: fewer FUSE round-trips on bulk writes, no
  # measured downside (default was 1MB).
  goFuseMaxWriteKB: "4096"

# Cross-cluster membership. Default off: an install that leaves this alone
# is a single-cluster deployment and behaves exactly as before.
#
# The global control plane holds an index, never bytes. It answers "which
# cluster published this path, into which bucket, under which key prefix";
# the reading cluster then fetches from object storage itself. There is no
# cross-cluster peer traffic and no inbound path into this cluster -- the
# coordinator dials OUT and holds the stream.
#
# If the control plane is unreachable this cluster keeps working exactly as
# a single-cluster deployment: local reads, writes, peer fetch and cloud
# fetch are untouched, and the mirror keeps serving its last-good contents.
# Only discovery of NEW remote publications stops.
globalCP:
  enabled: false
  # This cluster's identity in the global namespace. Required when enabled.
  #
  # Under mTLS this is advisory -- the control plane takes identity from the
  # first DNS SAN of the client certificate and ignores what is sent. Set it
  # to the same name the certificate carries so logs agree with reality.
  clusterId: ""
  # host:port of the control plane's gRPC port.
  endpoint: ""
  # Paths this cluster offers to the federation. Everything not matched here
  # stays local-only, which is what keeps the global index small enough for
  # each cluster to mirror it. Prefix match on the mount-relative path.
  #   e.g. ["/models/", "/checkpoints/"]
  publishPrefixes: []
  # Paths this cluster wants to learn about from others. Empty subscribes to
  # nothing: a cluster that asked for nothing gets nothing, never everything.
  subscribePrefixes: []
  tls:
    # Secret holding this cluster's client certificate. ISSUING IT IS
    # GRANTING THIS CLUSTER ITS IDENTITY: the control plane reads the first
    # DNS SAN as the cluster ID, so the SAN must be clusterId above.
    #
    # Empty means plaintext, which the coordinator permits but warns about
    # loudly, because identity is then self-declared and unverifiable. Only
    # for an in-cluster or dev control plane.
    secretName: ""
    certKey: tls.crt
    keyKey: tls.key
    caKey: ca.crt
    # Expected name in the control plane's server certificate. Empty uses
    # the host part of endpoint.
    serverName: ""
  # DEV ONLY: run the control plane in-process on loopback with no TLS, so
  # the cross-cluster path is exercisable without a second cluster. Mutually
  # exclusive with tls.secretName.
  embedded: false
  embeddedPort: 9091
  # Serve cross-cluster reads on the client. Off is free: only a local cloud
  # MISS consults the mirror, so no hit path changes. Requires the
  # coordinator to be running with globalCP.enabled.
  read: false

cloud:
  # Prefix every cloud object key with this cluster scope. Empty is the
  # legacy flat layout and is byte-identical to pre-federation behavior.
  #
  # Two clusters sharing one bucket MUST set different values or they
  # overwrite each other's objects silently. It is also what a remote
  # cluster reads under, so changing it after data exists orphans that data
  # from the global index (reads still find it locally -- the key mapper
  # tries the bare key as a fallback -- but other clusters will not).
  keyPrefix: ""

secrets:
  aws:
    create: true
    name: aws-credentials
    accessKeyId: REPLACE_WITH_ACCESS_KEY
    secretAccessKey: REPLACE_WITH_SECRET_KEY
    region: us-east-1
  azure:
    create: true
    name: azure-credentials
    account: REPLACE_WITH_ACCOUNT_NAME
    key: REPLACE_WITH_ACCOUNT_KEY
    container: fuse-cache

monitoring:
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 15s
    scrapeTimeout: 10s
    labels: {}
  grafanaDashboard:
    enabled: false
    namespace: ""
    labels:
      grafana_dashboard: "1"
