syntax = "proto3";

package pb;

option go_package = "fuse-client/internal/pb";

import "google/protobuf/timestamp.proto";

// CoordinatorService handles peer registration and file location metadata.
service CoordinatorService {
  rpc RegisterPeer(RegisterPeerRequest) returns (RegisterPeerResponse);
  rpc GetPeers(GetPeersRequest) returns (GetPeersResponse);
  rpc UpdatePeerStatus(UpdatePeerStatusRequest) returns (UpdatePeerStatusResponse);
  rpc GetFileLocation(GetFileLocationRequest) returns (GetFileLocationResponse);
  rpc UpdateFileLocation(UpdateFileLocationRequest) returns (UpdateFileLocationResponse);
  rpc DeleteFileLocation(DeleteFileLocationRequest) returns (DeleteFileLocationResponse);
  rpc GetPeerStats(GetPeerStatsRequest) returns (GetPeerStatsResponse);
}

message PeerInfo {
  string id = 1;
  string address = 2;
  string grpc_address = 3;
  string nvme_path = 4;
  int64 available_space = 5;
  int64 used_space = 6;
  string status = 7;
  google.protobuf.Timestamp last_heartbeat = 8;
  // Operator-assigned labels (e.g. pool=gpu, zone=a) used for targeted
  // cache-warm fan-out and other node selection.
  map<string, string> labels = 9;
  // Kubernetes node name (downward API NODE_NAME). Peers are keyed by
  // POD_IP:port, which nothing outside the cluster network can join back to a
  // Node or a scheduled Pod; this is the join key an external scheduler needs
  // to prefer nodes that already hold a dataset. Empty on older clients and
  // outside Kubernetes — never required for registration or selection.
  string node_name = 10;
  // Node IP (downward API status.hostIP). The second half of the join key:
  // node_name is what a human or a Kubernetes-aware controller joins on, but
  // an llm-d EndpointPicker only ever sees pod.Status.HostIP on its endpoints
  // (EndpointMetadata.NodeAddress) — it carries no node name at all. Without
  // this a router cannot tell which fuse peer is co-located with a candidate
  // model-server pod, since the two live in different pods and their pod IPs
  // share nothing. Same contract as node_name: advisory, empty off-Kubernetes
  // and on older clients, never required for registration or selection.
  string node_ip = 11;
}

message ChunkInfo {
  int32 index = 1;
  string peer_id = 2;
  string chunk_id = 3;
}

message FileLocation {
  string file_path = 1;
  string peer_id = 2;
  string storage_tier = 3;
  string storage_path = 4;
  int64 file_size = 5;
  google.protobuf.Timestamp last_accessed = 6;
  bool is_chunked = 7;
  repeated ChunkInfo chunks = 8;
  // Stride the file was written with. 0 = unknown (pre-field metadata);
  // readers fall back to their configured chunk size.
  int64 chunk_size = 9;
}

message RegisterPeerRequest {
  PeerInfo peer = 1;
}

message RegisterPeerResponse {}

message GetPeersRequest {
  string requester_id = 1;
}

message GetPeersResponse {
  repeated PeerInfo peers = 1;
}

message UpdatePeerStatusRequest {
  string peer_id = 1;
  string status = 2;
  int64 available_space = 3;
  int64 used_space = 4;
}

message UpdatePeerStatusResponse {}

message GetFileLocationRequest {
  string file_path = 1;
}

message GetFileLocationResponse {
  repeated FileLocation locations = 1;
}

message UpdateFileLocationRequest {
  FileLocation location = 1;
}

message UpdateFileLocationResponse {}

// DeleteFileLocationRequest retracts location metadata. With whole_path set the
// file is gone everywhere and every replica row is dropped; otherwise only the
// calling peer's own rows are removed (it evicted its copy, the file lives on).
message DeleteFileLocationRequest {
  string file_path = 1;
  string peer_id = 2;
  bool whole_path = 3;
}

message DeleteFileLocationResponse {}

message GetPeerStatsRequest {}

message GetPeerStatsResponse {
  int64 active_peers = 1;
  int64 total_peers = 2;
  int64 total_space = 3;
  int64 used_space = 4;
  int64 available_space = 5;
  int64 file_count = 6;
}
