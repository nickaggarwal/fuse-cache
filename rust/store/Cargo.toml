# The merge candidate: store-front (Rust server in front of the Go client on
# store nodes) and the burst load generator. Independent of rust/research.
[workspace]
resolver = "2"
members = ["crates/store-layout", "crates/store-front"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

# Exact pins (=); Cargo.lock is committed. Deliberately small: the server is
# blocking std I/O + httparse (sendfile and byte-exact proxying need the raw
# socket), no async runtime.
[workspace.dependencies]
libc = "=0.2.177"
httparse = "=1.10.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
percent-encoding = "=2.3.2"
httpdate = "=1.0.3"
clap = { version = "=4.5.51", features = ["derive", "env"] }
tempfile = "=3.23.0"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
