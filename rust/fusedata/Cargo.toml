[workspace]
resolver = "2"
members = ["crates/fusedata-core", "crates/fusedata"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

# Every dependency is pinned to an exact version (`=`) so a rebuild months from
# now produces the same binary. Cargo.lock is committed as well.
[workspace.dependencies]
libc = "=0.2.177"
httparse = "=1.10.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
hmac = "=0.12.1"
base64 = "=0.22.1"
hex = "=0.4.3"
httpdate = "=1.0.3"
percent-encoding = "=2.3.2"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
fuser = { version = "=0.16.0", default-features = false, features = ["abi-7-31"] }
clap = { version = "=4.5.51", features = ["derive", "env"] }
anyhow = "=1.0.100"
tempfile = "=3.23.0"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
