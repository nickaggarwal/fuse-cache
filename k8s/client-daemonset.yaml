apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: client
  namespace: fuse-system
  labels:
    app: client
spec:
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      hostPID: true
      nodeSelector:
        agentpool: userpool
      initContainers:
        # node-init discovers the best local disk (NVMe > SSD > ephemeral >
        # HDD, by class + free space + micro-benchmark), prepares
        # <mount>/fuse-cache on it, and writes node-init.json for the client.
        # Cloud-agnostic: works on AKS/EKS/GKE/bare metal without path tuning.
        - name: node-init
          image: stargzrepo.azurecr.io/fuse-client:latest
          command: ["node-init"]
          args:
            - "-mode"
            - "init"
            - "-host-root"
            - "/host"
            - "-config"
            - "/var/run/fuse-client/node-init.json"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: false
            - name: agent-socket
              mountPath: /var/run/fuse-client
        - name: prepare-fuse-mount
          image: stargzrepo.azurecr.io/fuse-client:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ROOT=/host/mnt
              TARGET=/host/mnt/fuse
              MAX_RETRIES=10
              DELAY=2
              mkdir -p "${ROOT}"
              i=1
              while [ "$i" -le "$MAX_RETRIES" ]; do
                echo "prepare-fuse-mount: attempt ${i}/${MAX_RETRIES} for ${TARGET}"
                fusermount3 -u -z "${TARGET}" >/dev/null 2>&1 || true
                fusermount -u -z "${TARGET}" >/dev/null 2>&1 || true
                umount -l "${TARGET}" >/dev/null 2>&1 || true
                rm -rf "${TARGET}" >/dev/null 2>&1 || true
                mkdir -p "${TARGET}" || true
                if stat "${TARGET}" >/dev/null 2>&1; then
                  chmod 0777 "${TARGET}" >/dev/null 2>&1 || true
                  exit 0
                fi
                sleep "${DELAY}"
                i=$((i+1))
              done
              echo "prepare-fuse-mount: unable to recover ${TARGET} after ${MAX_RETRIES} attempts"
              exit 1
          securityContext:
            privileged: true
          volumeMounts:
            - name: fuse-mount
              mountPath: /host/mnt
              mountPropagation: Bidirectional
      containers:
        # Sidecar: keeps node-init.json's free-space/budget figures fresh so
        # the client (and peers choosing replication targets by headroom)
        # see real capacity as the disk fills; re-runs discovery if the
        # cache dir vanishes (node repair, disk swap).
        - name: node-init-daemon
          image: stargzrepo.azurecr.io/fuse-client:latest
          command: ["node-init"]
          args:
            - "-mode"
            - "daemon"
            - "-host-root"
            - "/host"
            - "-config"
            - "/var/run/fuse-client/node-init.json"
            - "-refresh-interval-sec"
            - "60"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-root
              mountPath: /host
            - name: agent-socket
              mountPath: /var/run/fuse-client
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: client
          image: stargzrepo.azurecr.io/fuse-client:latest
          command: ["client"]
          args:
            - "-mount"
            - "$(FUSE_MOUNT_PATH)"
            - "-nvme"
            - "$(NVME_CACHE_PATH)"
            - "-node-init-config"
            - "/var/run/fuse-client/node-init.json"
            - "-node-init-host-root"
            - "/host"
            - "-coordinator"
            - "$(COORDINATOR_ADDR)"
            - "-coordinator-grpc"
            - "$(COORDINATOR_GRPC_ADDR)"
            - "-port"
            - "8081"
            - "-grpc-port"
            - "9081"
            - "-chunk-size"
            - "$(CHUNK_SIZE_MB)"
            - "-cloud-provider"
            - "azure"
          envFrom:
            - configMapRef:
                name: fuse-config
            - secretRef:
                name: azure-credentials
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 8081
              name: http
            - containerPort: 9081
              name: grpc
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - SYS_ADMIN
                - MKNOD
          volumeMounts:
            - name: fuse-device
              mountPath: /dev/fuse
            - name: nvme-storage
              mountPath: /mnt/nvme
            - name: host-root
              mountPath: /host
            - name: fuse-mount
              mountPath: /host/mnt
              mountPropagation: Bidirectional
            - name: agent-socket
              mountPath: /var/run/fuse-client
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - >
                    fusermount3 -u -z /host/mnt/fuse ||
                    umount -l /host/mnt/fuse ||
                    true
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              # Multi-GB reads/writes (e.g. GPU checkpoint tars) buffer
              # 4MB chunks in flight on both the cloud-persist and the
              # range-read paths; 4-8Gi OOM-kills the client mid-transfer
              # and tears down the FUSE mount on the node. TODO: bound the
              # chunk buffers in the client instead of oversizing the pod.
              memory: 16Gi
      volumes:
        - name: fuse-device
          hostPath:
            path: /dev/fuse
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: nvme-storage
          hostPath:
            path: /mnt
            type: Directory
        - name: fuse-mount
          hostPath:
            path: /mnt
            type: Directory
        - name: agent-socket
          hostPath:
            path: /var/run/fuse-client
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: client-headless
  namespace: fuse-system
  labels:
    app: client
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: client
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
    - port: 9081
      targetPort: 9081
      protocol: TCP
      name: grpc
