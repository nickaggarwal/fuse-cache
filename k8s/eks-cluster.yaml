# EKS test cluster for fuse-client + pod-snapshotter.
# Requirements driving the choices:
#   - pod-snapshotter: k8s >= 1.30, containerd >= 2.0 (EKS 1.33 AL2023 AMIs),
#     CRIU installed by its nodeSetup DaemonSet, no GPU needed for CPU pods.
#   - fuse-client: local NVMe per node (m6id.* instance store) discovered by
#     node-init; >=3 nodes for peer replication / herd tests.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: fuse-snap-test
  region: us-east-1
  version: "1.33"

iam:
  withOIDC: true

managedNodeGroups:
  - name: nvme-pool
    instanceType: m6id.2xlarge   # 8 vCPU / 32 GiB / 474 GB local NVMe / 12.5 Gbps
    desiredCapacity: 3
    minSize: 0
    maxSize: 3
    amiFamily: AmazonLinux2023
    volumeSize: 80               # EBS root; cache lives on instance-store NVMe
    privateNetworking: false
    labels:
      workload: fuse-snap-test
    iam:
      withAddonPolicies:
        imageBuilder: false
        ebs: true
