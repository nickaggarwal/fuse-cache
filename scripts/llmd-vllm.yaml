# Two vLLM pods, one per A100 node, both loading Qwen2.5-1.5B-Instruct from the
# FUSE mount rather than downloading from HuggingFace.
#
# One node has the weights resident on local NVMe (seeded there), the other does
# not and must pull them through the cache tiers. Same manifest, same image,
# same model path on both — the only difference is cache residency, which is
# exactly the variable under test.
#
# podAntiAffinity pins one replica per node. Without it both could land on the
# warm node and the comparison would silently measure nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  namespace: fuse-system
  labels:
    app: vllm-qwen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-qwen
  template:
    metadata:
      labels:
        app: vllm-qwen
        # The label EPP's --endpoint-selector matches on.
        llmd.ai/inference-server: "true"
    spec:
      nodeSelector:
        pool: gpuckpt
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: vllm-qwen
              topologyKey: kubernetes.io/hostname
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.3
          args:
            - --model
            - /mnt/fuse/models/Qwen2.5-1.5B-Instruct
            # served-model-name decouples the routing identity from the load
            # path: requests and the EPP config say "Qwen/Qwen2.5-1.5B-Instruct"
            # while vLLM reads from the mount.
            - --served-model-name
            - Qwen/Qwen2.5-1.5B-Instruct
            - --port
            - "8000"
            - --gpu-memory-utilization
            - "0.85"
            - --max-model-len
            - "4096"
          env:
            # No HF network access: if the weights are not on the mount, this
            # should fail loudly rather than quietly downloading them and
            # erasing the difference the test is measuring.
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 200
          volumeMounts:
            - name: fuse-mount
              mountPath: /mnt/fuse
              mountPropagation: HostToContainer
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: fuse-mount
          hostPath:
            path: /mnt/fuse
            type: Directory
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen
  namespace: fuse-system
spec:
  selector:
    app: vllm-qwen
  ports:
    - port: 8000
      targetPort: 8000
      name: http
